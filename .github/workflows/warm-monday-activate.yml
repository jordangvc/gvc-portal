name: Activate Monday cache warmer

# Creates/updates Cloud Scheduler job gvc-warm-monday → POST /v1/tasks/warm-monday
# every 5 minutes so cold Cloud Run instances hydrate Job Start / Morning /
# Job Check / Billing lists from GCS instead of waiting on Monday.
#
# Uses GCP_SA_KEY (same as deploy). Never prints secret values.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check | activate"
        required: true
        default: check
        type: choice
        options: [check, activate]

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    env:
      PROJECT: gvc-invoice-system
      REGION: us-central1
      SERVICE: gvc-invoice
      SITE_BASE: https://portal.greenvalleycontractors.com
      SCHEDULER_JOB: gvc-warm-monday
      API_SECRET: gvc-service-api-key
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve API key from Secret Manager
        id: apikey
        continue-on-error: true
        run: |
          set -euo pipefail
          if KEY=$(gcloud secrets versions access latest --secret="$API_SECRET" --project="$PROJECT" 2>/tmp/secret.err); then
            if [ -n "$KEY" ]; then
              echo "api_key_ok=true" >> "$GITHUB_OUTPUT"
              echo "::add-mask::$KEY"
              echo "GVC_SERVICE_API_KEY=$KEY" >> "$GITHUB_ENV"
            else
              echo "api_key_ok=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "api_key_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not read $API_SECRET"
          fi

      - name: Check service URL
        id: svc
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$PROJECT" \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Cloud Run URL: $URL"

      - name: Activate scheduler (every 5 min)
        if: ${{ inputs.mode == 'activate' && steps.apikey.outputs.api_key_ok == 'true' }}
        env:
          RUN_URL: ${{ steps.svc.outputs.url }}
        run: |
          set -euo pipefail
          BODY='{"force":true}'
          TMP=$(mktemp)
          printf '%s' "$BODY" > "$TMP"
          if gcloud scheduler jobs describe "$SCHEDULER_JOB" \
               --location="$REGION" --project="$PROJECT" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "$SCHEDULER_JOB" \
              --location="$REGION" --project="$PROJECT" \
              --schedule="*/5 * * * *" \
              --time-zone="America/New_York" \
              --uri="${RUN_URL}/v1/tasks/warm-monday" \
              --http-method=POST \
              --headers="Content-Type=application/json,X-API-Key=${GVC_SERVICE_API_KEY}" \
              --message-body-from-file="$TMP"
            echo "Updated scheduler job $SCHEDULER_JOB"
          else
            gcloud scheduler jobs create http "$SCHEDULER_JOB" \
              --location="$REGION" --project="$PROJECT" \
              --schedule="*/5 * * * *" \
              --time-zone="America/New_York" \
              --uri="${RUN_URL}/v1/tasks/warm-monday" \
              --http-method=POST \
              --headers="Content-Type=application/json,X-API-Key=${GVC_SERVICE_API_KEY}" \
              --message-body-from-file="$TMP"
            echo "Created scheduler job $SCHEDULER_JOB"
          fi
          rm -f "$TMP"

      - name: Dry POST warm (once)
        if: ${{ steps.apikey.outputs.api_key_ok == 'true' }}
        env:
          RUN_URL: ${{ steps.svc.outputs.url }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /tmp/warm.json -w '%{http_code}' \
            -X POST "${RUN_URL}/v1/tasks/warm-monday" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${GVC_SERVICE_API_KEY}" \
            -d '{"force":true}')
          echo "HTTP $CODE"
          head -c 800 /tmp/warm.json; echo
          test "$CODE" = "200"
