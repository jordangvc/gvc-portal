name: Deploy to Cloud Run

# Auto-deploy portal when master updates.
# One-time setup (Windows PowerShell): see docs/ops/auto-deploy-setup.md
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (source)
        # Same path as local: gcloud run deploy --source .
        # Does NOT rewrite env/secrets/flags already on the service.
        run: |
          gcloud run deploy gvc-invoice \
            --source . \
            --region us-central1 \
            --project gvc-invoice-system \
            --quiet
