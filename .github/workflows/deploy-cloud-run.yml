name: Deploy to Cloud Run

# Auto-deploy portal when master updates.
# One-time setup (Windows PowerShell): see docs/ops/auto-deploy-setup.md
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            libcairo2 libgdk-pixbuf-2.0-0 shared-mime-info \
            fonts-liberation fonts-dejavu

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile packages
        run: python -m compileall -q app orchestrators subsystems adapters shared

      - name: Pytest (gate)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q --tb=line

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (source)
        # Same path as local: gcloud run deploy --source .
        # Does NOT rewrite env/secrets/flags already on the service.
        run: |
          gcloud run deploy gvc-invoice \
            --source . \
            --region us-central1 \
            --project gvc-invoice-system \
            --quiet
