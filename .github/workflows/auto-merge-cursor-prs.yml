name: Auto-merge cursor PRs

# Cloud-agent branches (`cursor/*`) land on master without Jordan clicking Merge.
# After merge, deploy-cloud-run.yml already deploys on master push.
#
# Gates:
#   - PR targets master, not draft
#   - head branch starts with cursor/
#   - no hold / do-not-merge labels
#   - compileall + pytest pass (same bar as deploy)
#
# Hold a PR: add label `hold` or `do-not-merge`, or keep it as draft.
#
# One-time repo setup: docs/ops/auto-merge-setup.md

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]

concurrency:
  group: auto-merge-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  gate:
    if: >
      github.event.pull_request.draft == false &&
      startsWith(github.head_ref, 'cursor/') &&
      !contains(github.event.pull_request.labels.*.name, 'hold') &&
      !contains(github.event.pull_request.labels.*.name, 'do-not-merge')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            libcairo2 libgdk-pixbuf-2.0-0 shared-mime-info \
            fonts-liberation fonts-dejavu

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile packages
        run: python -m compileall -q app orchestrators subsystems adapters shared

      - name: Pytest (gate)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q --tb=line

  merge:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge into master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Wait briefly if GitHub still computing mergeability after the last push.
          for i in 1 2 3 4 5 6; do
            state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeable,mergeStateStatus \
              --jq '"\(.mergeable):\(.mergeStateStatus)"')
            echo "mergeability=$state"
            case "$state" in
              MERGEABLE:CLEAN|MERGEABLE:UNSTABLE|MERGEABLE:HAS_HOOKS|MERGEABLE:BEHIND)
                break
                ;;
              MERGEABLE:BLOCKED)
                # No required reviewers/checks on this repo today; still try merge.
                break
                ;;
              *)
                sleep 5
                ;;
            esac
          done
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
