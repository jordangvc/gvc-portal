<!DOCTYPE html>
<html lang="en" data-palette="emerald">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GVC GM Morning Huddle</title>
<script>
/* FOUC-safe theme boot — same key as /ui/gvc-theme.js (gvc-theme). */
(function () {
  try {
    var k = "gvc-theme", v = localStorage.getItem(k);
    var mode = (v === "light" || v === "dark" || v === "system") ? v : "system";
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    var theme = mode === "light" ? "light" : mode === "dark" ? "dark" : (dark ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
    document.documentElement.setAttribute("data-theme-mode", mode);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "light");
  }
})();
</script>
<link rel="stylesheet" href="/ui/gvc-ui.css" />
<style>
  body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  .page {
    max-width: 720px; margin: 0 auto;
    padding: var(--space-5) var(--space-4) var(--space-12);
    display: grid; gap: var(--space-4);
  }
  .page > .card { padding: var(--space-5); }
  .page-hd h1 {
    margin: var(--space-1) 0 0;
    font-size: var(--text-2xl); font-weight: 700;
    font-family: var(--font-display);
  }
  .page > .card > h2 {
    margin: 0 0 var(--space-3);
    font-size: var(--text-xs); font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--color-text-muted);
  }
  .stat-chip {
    display: inline-block; padding: 6px 12px; border-radius: var(--radius-full);
    border: 1px solid var(--color-border); font-size: var(--text-sm); font-weight: 600;
    background: var(--color-surface);
  }
  .stat-chip.ok { background: var(--color-primary-soft); border-color: var(--color-primary); color: var(--color-primary); }
  .stat-chip.warn { background: var(--color-warn-soft); border-color: var(--color-warn); color: var(--color-accent-ink); }
  .row {
    border: 1px solid var(--color-border); border-radius: var(--radius-md);
    padding: 10px 12px; background: var(--color-bg);
  }
  .row-meta { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: 4px; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .field-stack { display: grid; gap: var(--space-2); margin-top: var(--space-2); }
  #err {
    display: none; padding: 12px 14px; border-radius: var(--radius-md);
    background: var(--color-danger-soft); border: 1px solid var(--color-danger); color: var(--color-danger);
    font-size: var(--text-sm);
  }
  #err.show { display: block; }
  @media (max-width: 640px) {
    .page { padding: var(--space-4) var(--space-3) var(--space-12); }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="btn btn-sm btn-hub" href="/" aria-label="Back to hub">← Hub</a>
  <div class="topbar__title">
    <span class="kicker"><a href="/" style="color:inherit;text-decoration:none">GVC Portal</a></span>
    <h1>GM Huddle</h1>
  </div>
  <div class="topbar__actions">
    <span class="muted" style="font-size:var(--text-xs);max-width:10rem;overflow:hidden;text-overflow:ellipsis" title="{{EMAIL}}">{{EMAIL}}</span>
    <button type="button" class="btn btn-sm" id="theme-toggle" data-theme-label>Auto</button>
    <a class="btn btn-sm btn-ghost" href="/auth/logout">Sign out</a>
  </div>
</header>

<div class="page">
  <div class="page-hd">
    <p class="kicker">6:45 operations huddle</p>
    <h1>Run sheet</h1>
    <div id="chips" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px"></div>
  </div>
  <div id="err"></div>

  <section class="card">
    <h2>Meeting</h2>
    <div class="btn-row">
      <button class="btn" id="start" type="button">Start huddle</button>
      <button class="btn" id="end" type="button">End + scorecard</button>
      <a class="btn" href="/ui/morning">My brief</a>
    </div>
    <div id="meetmeta" class="muted" style="margin-top:8px;font-size:var(--text-sm)"></div>
  </section>

  <section class="card"><h2>Sequence (routed first)</h2><div id="seq"></div></section>
  <section class="card"><h2>Unscheduled / needs planning (last)</h2><div id="unsch"></div></section>

  <section class="card">
    <h2>Action Requests</h2>
    <div class="btn-row">
      <button class="btn" id="migrateNfj" type="button">Import Needs from Jordan → Action Requests</button>
    </div>
    <div id="migrateMsg" class="muted" style="margin-top:6px;font-size:var(--text-sm)"></div>
    <div id="ars" style="margin-top:var(--space-3)"></div>
  </section>

  <section class="card">
    <h2>Park a topic</h2>
    <div class="field-stack">
      <input class="input" id="pTopic" placeholder="Topic" />
      <input class="input" id="pOwner" placeholder="Owner" />
      <button class="btn" id="pAdd" type="button">Park</button>
    </div>
    <div id="parking" style="margin-top:var(--space-3)"></div>
  </section>

  <section class="card">
    <h2>Assign action</h2>
    <div class="field-stack">
      <textarea class="input" id="aText" placeholder="Action" rows="3"></textarea>
      <input class="input" id="aOwner" placeholder="Owner" />
      <button class="btn" id="aAdd" type="button">Add action</button>
    </div>
    <div id="actions" style="margin-top:var(--space-3)"></div>
  </section>

  <section class="card"><h2>Fireflies proposals</h2><div id="ff"></div></section>
</div>

<script src="/ui/gvc-command.js"></script>
<script>
const esc = (s) => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
async function api(u, o){ const r=await fetch(u,o); const b=await r.json(); if(!r.ok) throw new Error((b.detail&&b.detail.detail)||b.detail||r.status); return b; }
function rows(list){ return (list||[]).map(p => `<div class="row"><b>${esc(p.name)}</b><div class="row-meta">${esc(p.stage||"")} ${esc(p.blocked||"")} ${esc(p.location||"")}</div>
  <a href="${esc(p.url)}" target="_blank" rel="noopener">Monday</a></div>`).join("") || "<div class='muted' style='font-size:var(--text-sm)'>None</div>"; }
function render(d){
  const tp=d.team_prep||{};
  document.getElementById("chips").innerHTML =
    `<span class="stat-chip ${tp.pct>=80?"ok":"warn"}">${tp.pct??"—"}% team prep (${tp.prepared||0}/${tp.team_size||0})</span>` +
    `<span class="stat-chip">${(d.sequence||[]).length} in sequence</span>` +
    `<span class="stat-chip">${(d.action_requests||[]).length} open ARs</span>`;
  document.getElementById("seq").innerHTML = rows(d.sequence);
  document.getElementById("unsch").innerHTML = rows(d.unscheduled);
  document.getElementById("ars").innerHTML = (d.action_requests||[]).map(r =>
    `<div class="row"><b>${esc(r.need)}</b><div class="row-meta">${esc(r.needed_from_email)} · ${esc(r.escalation||r.status)}</div></div>`).join("") || "<div class='muted' style='font-size:var(--text-sm)'>Clear</div>";
  const m=d.meeting||{};
  document.getElementById("meetmeta").textContent = m.started_at ? `Started ${m.started_at}${m.ended_at?" · ended "+m.ended_at:""}` : "Not started";
  document.getElementById("parking").innerHTML = (m.parking||[]).map(p=>`<div class="row">${esc(p.topic)} — ${esc(p.owner)}</div>`).join("");
  document.getElementById("actions").innerHTML = (m.actions||[]).map(p=>`<div class="row">${esc(p.text)} — ${esc(p.owner)}</div>`).join("");
  document.getElementById("ff").innerHTML = (d.fireflies_proposals||[]).length
    ? d.fireflies_proposals.map(p=>`<div class="row">${esc(p.summary||p.title||p.id)}</div>`).join("")
    : "<div class='muted' style='font-size:var(--text-sm)'>No pending proposals (Fireflies key optional).</div>";
}
async function load(){ try{ render(await api("/ui/api/morning/gm")); document.getElementById("err").className=""; }
  catch(e){ document.getElementById("err").className="show"; document.getElementById("err").textContent=e.message; } }
document.getElementById("start").onclick = async () => { await api("/ui/api/morning/meeting/start",{method:"POST"}); load(); };
document.getElementById("end").onclick = async () => { await api("/ui/api/morning/meeting/end",{method:"POST"}); load(); };
document.getElementById("pAdd").onclick = async () => {
  await api("/ui/api/morning/meeting/parking",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({topic:pTopic.value, owner:pOwner.value})}); pTopic.value=""; load(); };
document.getElementById("aAdd").onclick = async () => {
  await api("/ui/api/morning/meeting/action",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({text:aText.value, owner:aOwner.value})}); aText.value=""; load(); };
document.getElementById("migrateNfj").onclick = async () => {
  const msg = document.getElementById("migrateMsg");
  const btn = document.getElementById("migrateNfj");
  btn.disabled = true;
  msg.textContent = "Importing…";
  try {
    const out = await api("/ui/api/morning/action-requests/migrate-nfj", { method: "POST" });
    msg.textContent = `Created ${out.created||0} · skipped ${out.skipped||0} (already open or clear). Monday column left unchanged.`;
    await load();
  } catch (e) {
    msg.textContent = String(e.message || e);
  } finally {
    btn.disabled = false;
  }
};
load();
fetch("/ui/api/monday/warm", {
  method: "POST", credentials: "same-origin", keepalive: true,
}).catch(function () {});
</script>
<script src="/ui/gvc-theme.js"></script>
<script>
  if (window.GvcTheme) { window.GvcTheme.mount(document.getElementById("theme-toggle")); }
</script>
</body>
</html>
