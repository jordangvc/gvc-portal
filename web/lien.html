<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GVC Lien Watch</title>
<style>
  :root {
    --green: #235339; --green-dark: #1A3E2B; --gold: #C9A24B; --gold-dark: #96763B; --ink: #1C1917; --muted: #78716C;
    --line: #E7E0CE; --bg: #FAFAF8; --warn-bg: #FBF3E1; --warn-line: #E3CFA0;
    --err-bg: #FEE7E7; --err-line: #DC2626;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { background: var(--green); border-bottom: 2.5px solid var(--gold); color: #fff; padding: 16px 24px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .who { font-size: 13px; opacity: .95; display: flex; align-items: center; gap: 12px; }
  .who a { color: #fff; text-decoration: underline; }
  #health { font-size: 12px; opacity: .95; display: flex; gap: 12px; flex-wrap: wrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #C8C2B0; display: inline-block; }
  .dot.ok { background: #5FB878; } .dot.bad { background: #E88070; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; display: grid; gap: 20px; }
  .card { background: #fff; border: 1px solid var(--line); border-top: 2px solid #B9954E; border-radius: 10px; padding: 20px; }
  .card h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 14px; }
  .card h2 .opt { text-transform: none; font-weight: 400; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  /* Standard GVC Portal header (shared across all tool pages) */
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
  header h1 { text-align: center; }
  header .home-link { justify-self: start; color: #fff; text-decoration: none; font-weight: 700;
    font-size: 15px; display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px;
    border-radius: 8px; opacity: .95; }
  header .home-link:hover { background: rgba(255, 255, 255, .16); opacity: 1; }
  header .home-link .chev { font-size: 17px; line-height: 1; }
  header #health, header .who { justify-self: end; }
  @media (max-width: 720px) {
    header { grid-template-columns: auto 1fr; }
    header h1 { grid-column: 1 / -1; grid-row: 2; text-align: left; }
    header #health, header .who { grid-row: 1; }
  }
  /* GVC brand kit (Jul 2026): serif wordmark + G monogram, gold on commitments */
  header h1 { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; letter-spacing: .01em;
    display: flex; align-items: center; gap: 9px; justify-content: center; }
  header h1::before { content: "G"; width: 26px; height: 26px; border-radius: 50%; flex: 0 0 26px;
    background: #1B382B; border: 1.5px solid var(--gold, #C9A24B); color: var(--gold, #C9A24B);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; font-family: Georgia, serif; }

  /* Lien Watch page */
  .banner { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 10px;
    padding: 12px 16px; font-size: 14px; color: #7c2d12; }
  .summary { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .summary .count { font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; }
  .chip { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .chip.missed   { background: #7A1F1F; color: #fff; }
  .chip.critical { background: var(--err-bg); color: #991b1b; border: 1px solid var(--err-line); }
  .chip.warn     { background: var(--warn-bg); color: #9a3412; border: 1px solid var(--warn-line); }
  .chip.ok       { background: #F2F7EE; color: var(--green-dark); border: 1px solid #bcd6c8; }
  .chip.unknown  { background: #F6F5F0; color: var(--muted); border: 1px solid var(--line); }
  .chip.basis    { background: #FBF3E1; color: var(--gold-dark); border: 1px solid #E3CFA0; text-transform: none; }
  .job { border-left: 4px solid var(--line); }
  .job.missed, .job.critical { border-left-color: #dc2626; }
  .job.warn { border-left-color: #f59e0b; }
  .job.ok { border-left-color: var(--green); }
  .job-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .job-head .name { font-size: 15px; font-weight: 700; }
  .job-head .name a { color: var(--ink); text-decoration: none; }
  .job-head .name a:hover { color: var(--green-dark); text-decoration: underline; }
  .job-meta { font-size: 13px; color: var(--muted); margin-top: 2px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .dl-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13.5px; }
  .dl-table th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); }
  .dl-table td { padding: 7px 10px 7px 0; border-bottom: 1px solid #f1ece0; vertical-align: top; }
  .dl-table tr:last-child td { border-bottom: 0; }
  .dl-table .days { font-weight: 700; white-space: nowrap; }
  .dl-table .statute { color: var(--muted); font-size: 12.5px; }
  .dl-note { color: var(--muted); font-size: 12px; }
  .notes { margin: 10px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); }
  .notes li { margin: 2px 0; }
  .table-wrap { overflow-x: auto; }
  #status { padding: 12px 14px; border-radius: 8px; font-size: 14px; display: none; }
  #status.show { display: block; }
  #status.info { background: #EAF2FF; border: 1px solid #9CC4E4; }
  #status.err { background: var(--err-bg); border: 1px solid var(--err-line); color: #7A1F1F; }
  .meta-line { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <a class="home-link" href="/" title="Back to the GVC Portal home"><span class="chev">‹</span> GVC Portal</a>
  <h1>Lien Watch</h1>
  <div class="who"><div id="health">Checking service…</div><a href="/auth/logout">Sign out</a></div>
</header>

<main>
  <div class="banner">
    ⚠️ <strong>Deadline math is unverified by counsel — attorney review pending (P0).</strong>
    This page informs; it does not replace legal advice.
  </div>

  <div id="status"></div>

  <div class="card">
    <h2>Every active job <span class="opt">— notice / lien / retainage deadlines, most-urgent first</span></h2>
    <div class="summary" id="summary">Loading the Projects board…</div>
    <div class="hint" id="meta"></div>
  </div>

  <div id="jobs"></div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const SEV_LABEL = { missed: "Missed", critical: "Critical", warn: "Warning",
                    ok: "OK", unknown: "Unknown" };
const TYPE_LABEL = { residential: "Residential", commercial: "Commercial",
                     public: "Public", unknown: "Type unknown", either: "either type" };

function showStatus(kind, html) {
  const el = $("#status");
  el.className = "show " + kind;
  el.innerHTML = html;
}

function chip(sev) {
  return `<span class="chip ${esc(sev)}">${esc(SEV_LABEL[sev] || sev)}</span>`;
}

function daysText(d) {
  if (d === null || d === undefined) return "—";
  if (d < 0) return `${-d}d overdue`;
  if (d === 0) return "due today";
  return `${d}d left`;
}

function deadlineRow(dl) {
  const due = dl.due_date
    ? `${esc(dl.due_date)}`
    : `<span class="dl-note">${esc(dl.window)} after ${esc(dl.anchor_text)} — not tracked yet</span>`;
  const variant = dl.ambiguous
    ? ` <span class="dl-note">(if ${esc(TYPE_LABEL[dl.project_type_variant] || dl.project_type_variant)})</span>`
    : "";
  return `<tr>
    <td>${chip(dl.severity)}</td>
    <td><strong>${esc(dl.label)}</strong>${variant}
      ${dl.note ? `<div class="dl-note">${esc(dl.note)}</div>` : ""}</td>
    <td>${due}</td>
    <td class="days">${esc(daysText(dl.days_remaining))}</td>
    <td class="statute">${dl.source_url
      ? `<a href="${esc(dl.source_url)}" target="_blank" rel="noopener">${esc(dl.statute || "")}</a>`
      : esc(dl.statute || "")}</td>
  </tr>`;
}

function basisChip(job) {
  if (!job.first_furnishing) return `<span class="chip unknown">no clock</span>`;
  const label = job.first_furnishing_basis === "start_date"
    ? `Start Date ${job.first_furnishing}`
    : `assumed ${job.first_furnishing} (item created)`;
  return `<span class="chip basis" title="First-furnishing basis">${esc(label)}</span>`;
}

function jobCard(job) {
  const type = TYPE_LABEL[job.project_type] || job.project_type;
  const rows = (job.deadlines || []).map(deadlineRow).join("");
  const table = rows
    ? `<div class="table-wrap"><table class="dl-table">
         <thead><tr><th>Status</th><th>Deadline</th><th>Due</th><th>Days</th><th>Statute</th></tr></thead>
         <tbody>${rows}</tbody></table></div>`
    : "";
  const notes = (job.notes || []).length
    ? `<ul class="notes">${job.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>` : "";
  return `<div class="card job ${esc(job.max_severity)}">
    <div class="job-head">
      ${chip(job.max_severity)}
      <span class="name"><a href="${esc(job.url)}" target="_blank" rel="noopener">${esc(job.name)}</a></span>
    </div>
    <div class="job-meta">
      <span>State: <strong>${esc(job.state || "?")}</strong></span>
      <span>${esc(type)}${job.ambiguous_type ? " — both variants shown" : ""}</span>
      ${basisChip(job)}
      ${job.project_number ? `<span>Project # ${esc(job.project_number)}</span>` : ""}
      ${job.group ? `<span>${esc(job.group)}</span>` : ""}
    </div>
    ${table}${notes}
  </div>`;
}

async function load() {
  try {
    const r = await fetch("/ui/api/lien/status");
    const body = await r.json();
    if (!r.ok || !body.ok) {
      const d = body.detail || body;
      showStatus("err", `<strong>${esc(d.code || "ERROR")}</strong> — ${esc(d.detail || "Couldn't load the tracker.")}<br>${esc(d.advice || "")}`);
      $("#summary").textContent = "Tracker unavailable.";
      return;
    }
    const c = body.counts || {};
    $("#summary").innerHTML =
      `<span class="count">${c.jobs ?? 0} active jobs</span>` +
      ["missed", "critical", "warn", "ok", "unknown"]
        .filter((s) => c[s])
        .map((s) => `<span class="count">${chip(s)} ${c[s]}</span>`).join("");
    $("#meta").textContent =
      `Rules pack ${body.rules_version} · computed ${body.generated_at} · ` +
      `Monday Projects board is read-only here — alerts are built but OFF.`;
    $("#jobs").innerHTML = (body.jobs || []).map(jobCard).join("");
  } catch (e) {
    showStatus("err", `Network error — ${esc(e.message)}`);
    $("#summary").textContent = "Tracker unavailable.";
  }
}

async function checkHealth() {
  try {
    const r = await fetch("/health"); const h = await r.json();
    const dot = (ok) => `<span class="dot ${ok ? "ok" : "bad"}"></span>`;
    $("#health").innerHTML =
      `<span>${dot(h.monday_configured)} Monday</span>` +
      `<span>${dot(h.slack_configured)} Slack</span>`;
  } catch (e) { $("#health").textContent = "Service status unavailable"; }
}

checkHealth();
load();
</script>
</body>
</html>
