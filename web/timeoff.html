<!DOCTYPE html>
<html lang="en" data-palette="emerald">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GVC Portal — Time Off</title>
<script>
/* FOUC-safe theme boot — same key as /ui/gvc-theme.js (gvc-theme). */
(function () {
  try {
    var k = "gvc-theme", v = localStorage.getItem(k);
    var mode = (v === "light" || v === "dark" || v === "system") ? v : "system";
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    var theme = mode === "light" ? "light" : mode === "dark" ? "dark" : (dark ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
    document.documentElement.setAttribute("data-theme-mode", mode);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "light");
  }
})();
</script>
<link rel="stylesheet" href="/ui/gvc-ui.css" />
<style>
  body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  .page {
    max-width: 760px; margin: 0 auto;
    padding: var(--space-5) var(--space-4) var(--space-12);
    display: grid; gap: var(--space-4);
  }
  .page > .card { padding: var(--space-5); }
  .page > .card > h2 {
    font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .08em;
    color: var(--color-text-muted); margin: 0 0 var(--space-3); font-weight: 700;
  }
  .intro { margin: 0; color: var(--color-text-muted); font-size: var(--text-sm); line-height: 1.45; }
  .notice {
    background: var(--color-warn-soft); border: 1px solid var(--color-warn);
    border-left: 4px solid var(--color-accent); border-radius: var(--radius-md);
    padding: var(--space-5); font-size: var(--text-sm);
  }
  .notice h2 { margin: 0 0 var(--space-2); font-size: var(--text-base); }
  iframe.form, .to-embed {
    width: 100%; height: 1200px; border: 1px solid var(--color-border);
    border-radius: var(--radius-lg); background: var(--color-surface);
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="btn btn-sm btn-hub" href="/" aria-label="Back to hub">← Hub</a>
  <div class="topbar__title">
    <span class="kicker"><a href="/" style="color:inherit;text-decoration:none">GVC Portal</a></span>
    <h1>Time Off</h1>
  </div>
  <div class="topbar__actions">
    <span class="muted" style="font-size:var(--text-xs);max-width:10rem;overflow:hidden;text-overflow:ellipsis" title="{{EMAIL}}">{{EMAIL}}</span>
    <button type="button" class="btn btn-sm" id="theme-toggle" data-theme-label>Auto</button>
    <a class="btn btn-sm btn-ghost" href="/auth/logout">Sign out</a>
  </div>
</header>

<div class="page">
  <div class="card">
    <h2>Request time off</h2>
    <p class="intro">Submissions go to the office for scheduling.</p>
  </div>
  {{FORM_IFRAME}}
</div>

<script src="/ui/gvc-theme.js"></script>
<script>
if (window.GvcTheme) { window.GvcTheme.mount(document.getElementById("theme-toggle")); }
</script>
</body>
</html>
