<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GVC Portal — Time Off</title>
<style>
  :root {
    --green: #2f6f4f; --green-dark: #245a40; --ink: #1f2933; --muted: #6b7280;
    --line: #e2e6ea; --bg: #f6f7f8; --warn-bg: #fff7ed; --warn-line: #fdba74;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { background: var(--green); color: #fff; padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .who { font-size: 13px; opacity: .95; display: flex; align-items: center; gap: 12px; }
  .who a { color: #fff; text-decoration: underline; }
  main { max-width: 900px; margin: 0 auto; padding: 24px; }
  iframe.form { width: 100%; height: 1200px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .notice { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 10px;
    padding: 20px; font-size: 15px; }
  .notice h2 { margin: 0 0 8px; font-size: 16px; }
  .muted { color: var(--muted); }
  /* Standard GVC Portal header (shared across all tool pages) */
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
  header h1 { text-align: center; }
  header .home-link { justify-self: start; color: #fff; text-decoration: none; font-weight: 700;
    font-size: 15px; display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px;
    border-radius: 8px; opacity: .95; }
  header .home-link:hover { background: rgba(255, 255, 255, .16); opacity: 1; }
  header .home-link .chev { font-size: 17px; line-height: 1; }
  header #health, header .who { justify-self: end; }
  @media (max-width: 720px) {
    header { grid-template-columns: auto 1fr; }
    header h1 { grid-column: 1 / -1; grid-row: 2; text-align: left; }
    header #health, header .who { grid-row: 1; }
  }
  /* ── Section color (added 2026-06-24) — tinted cards + accent bars to reduce
     visual fatigue on long forms. Calm green/slate alternation; overrides the
     plain white .card above via source order. ── */
  :root {
    --sec-tint-a: #f2f7f4; --sec-bar-a: #2f6f4f; --sec-band-a: #e7f1ec; --sec-band-a-ink: #245a40;
    --sec-tint-b: #dbe4ed; --sec-bar-b: #5b7a99; --sec-band-b: #dbe4ed; --sec-band-b-ink: #34495e;
  }
  .card { background: var(--sec-tint-a); border-left: 4px solid var(--sec-bar-a);
    box-shadow: 0 4px 0 0 var(--sec-bar-a); }
  .card h2 { background: var(--sec-band-a); color: var(--sec-band-a-ink);
    margin: -8px -8px 16px; padding: 10px 12px; border-radius: 8px; }
  .card:nth-of-type(even) { background: var(--sec-tint-b); border-left-color: var(--sec-bar-b);
    box-shadow: 0 4px 0 0 var(--sec-bar-b); }
  .card:nth-of-type(even) h2 { background: var(--sec-band-b); color: var(--sec-band-b-ink); }
</style>
</head>
<body>
<header>
  <a class="home-link" href="/" title="Back to the GVC Portal home"><span class="chev">‹</span> GVC Portal</a>
  <h1>🌴 Time Off</h1>
  <div class="who"><span>{{EMAIL}}</span><a href="/auth/logout">Sign out</a></div>
</header>

<main>
  {{FORM_IFRAME}}
</main>
</body>
</html>
