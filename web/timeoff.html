<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GVC Portal — Time Off</title>
<!-- Shared design system. See docs/CLAUDE-DESIGN-BRIEF.md. -->
<link rel="stylesheet" href="/ui/gvc.css" />
<style>
  /* Page-local: the embedded Google Form iframe + the "not configured" notice
     (the notice markup is injected server-side as .notice/.muted, so those
     class names are styled here rather than swapped for gvc-banner). */
  .to-embed { width:100%; height:1200px; border:1px solid var(--gvc-line);
    border-radius:var(--gvc-r-lg); background:var(--gvc-surface); }
  .notice { background:var(--gvc-warn-tint); border:1px solid #E0CDA9;
    border-left:4px solid var(--gvc-gold-dark); border-radius:var(--gvc-r);
    padding:var(--gvc-space-5); font-size:var(--gvc-fs-body); }
  .notice h2 { margin:0 0 var(--gvc-space-2); font-size:var(--gvc-fs-lead); }
  .muted { color:var(--gvc-muted); }
  /* The server injects the iframe with class="form"; alias it to the sized box. */
  iframe.form { width:100%; height:1200px; border:1px solid var(--gvc-line);
    border-radius:var(--gvc-r-lg); background:var(--gvc-surface); }
</style>
</head>
<body>

<header class="gvc-topbar">
  <div class="gvc-topbar-in">
    <a class="gvc-brand" href="/">
      <span class="gvc-mono">G</span>
      <span class="gvc-wordmark">Green Valley Contractors</span>
    </a>
    <span class="gvc-topbar-sep"></span>
    <span class="gvc-topbar-title">Time Off</span>
    <div class="gvc-topbar-right">
      <span class="gvc-topbar-user">{{EMAIL}}</span>
      <a class="gvc-signout" href="/auth/logout">Sign out</a>
    </div>
  </div>
</header>

<main class="gvc-shell">
  <div class="gvc-page-hd">
    <p class="gvc-eyebrow">People</p>
    <h1 class="gvc-h1">Time Off</h1>
    <p class="gvc-sub">Request time off. Submissions go to the office for scheduling.</p>
  </div>
  {{FORM_IFRAME}}
</main>
</body>
</html>
