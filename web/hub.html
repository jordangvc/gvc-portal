<!DOCTYPE html>
<html lang="en" data-palette="emerald">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GVC · Your hub</title>
<script>
(function () {
  try {
    var k = "gvc-theme", v = localStorage.getItem(k);
    var mode = (v === "light" || v === "dark" || v === "system") ? v : "system";
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    var theme = mode === "light" ? "light" : mode === "dark" ? "dark" : (dark ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
    document.documentElement.setAttribute("data-theme-mode", mode);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "light");
  }
})();
</script>
<link rel="stylesheet" href="/ui/gvc.css" />
</head>
<body>

<div class="hub-app" id="app">
  <aside class="hub-rail" id="rail" aria-label="Tools">
    <div class="hub-rail__brand">
      <span class="hub-rail__mark">G</span>
      <span class="hub-rail__word">Green Valley</span>
    </div>
    <div class="hub-rail__search">
      <input type="search" id="railsearch" placeholder="Find a tool" autocomplete="off" />
    </div>
    <nav class="hub-rail__nav" id="railnav"></nav>
    <div class="hub-rail__user">
      <span class="hub-avatar" id="railavatar">?</span>
      <div class="hub-rail__user-meta">
        <div class="hub-rail__user-name" id="railname">…</div>
        <div class="hub-rail__user-role" id="railrole"></div>
      </div>
      <button type="button" class="hub-rail__signout" id="theme-toggle-rail" data-theme-label>Auto</button>
      <a class="hub-rail__signout" href="/auth/logout">Sign out</a>
    </div>
  </aside>

  <div class="hub-main">
    <header class="hub-top">
      <button type="button" class="hub-top__menu" id="menubtn" aria-label="Open tools">☰</button>
      <div class="hub-top__title">Your hub</div>
      <span class="hub-avatar" id="topavatar">?</span>
    </header>

    <div class="hub-body" id="home">
      <div class="hub-search-panel" id="searchpanel">
        <input type="search" id="mobilesearch" placeholder="Find a tool" autocomplete="off" />
        <div class="hub-search-hits" id="searchhits"></div>
      </div>

      <div id="skel" class="hub-skel" aria-hidden="true">
        <div class="hub-skel__title"></div>
        <div class="hub-skel__line"></div>
        <div class="hub-skel__line hub-skel__line--short"></div>
        <div class="hub-skel__row">
          <div class="hub-skel__card"></div>
          <div class="hub-skel__card"></div>
        </div>
        <div class="hub-skel__metrics">
          <div class="hub-skel__metric"></div>
          <div class="hub-skel__metric"></div>
          <div class="hub-skel__metric"></div>
          <div class="hub-skel__metric"></div>
        </div>
      </div>

      <div id="hublive" hidden>
        <p class="hub-greet hub-rise hub-rise--1" id="greeting"></p>
        <p class="hub-date hub-rise hub-rise--1" id="dateline"></p>
        <p class="hub-summary hub-rise hub-rise--2" id="summary"></p>
        <div class="hub-rise hub-rise--2" id="homectawrap" hidden>
          <a class="hub-home-cta" id="homecta" href="#">Open</a>
        </div>

        <section class="hub-rise hub-rise--3" aria-labelledby="needs-kicker">
          <p class="hub-kicker hub-kicker--needs" id="needs-kicker">
            Needs you today
            <span class="hub-kicker__count" id="needscount" hidden></span>
          </p>
          <div id="needs"></div>
        </section>

        <section class="hub-rise hub-rise--3" aria-labelledby="metrics-kicker">
          <p class="hub-kicker" id="metrics-kicker">At a glance</p>
          <div class="hub-metrics" id="metrics"></div>
        </section>

        <div class="hub-cols hub-rise hub-rise--4">
          <section class="hub-panel" aria-labelledby="queue-title">
            <div class="hub-panel__hd">
              <h2 class="hub-panel__title" id="queue-title">Queue</h2>
              <a class="hub-panel__link" id="queuelink" href="#">Open</a>
            </div>
            <div class="hub-queue-scroll" id="queue"></div>
          </section>

          <div class="hub-stack-side">
            <section class="hub-panel" aria-labelledby="pinned-title">
              <div class="hub-panel__hd">
                <h2 class="hub-panel__title" id="pinned-title">Pinned</h2>
              </div>
              <div id="pinned"></div>
            </section>
            <section class="hub-panel" aria-labelledby="activity-title">
              <div class="hub-panel__hd">
                <h2 class="hub-panel__title" id="activity-title">Activity</h2>
                <a class="hub-panel__link" id="activityall" href="/ui/activity">All</a>
              </div>
              <div class="hub-act-scroll" id="activity"></div>
            </section>
          </div>
        </div>

        <section class="hub-rise hub-rise--4" aria-labelledby="recent-kicker">
          <p class="hub-kicker" id="recent-kicker">Jump back in</p>
          <div class="hub-recent" id="recent"></div>
        </section>

        <div class="hub-ft-note">
          <span>Signed in as <span id="emailnote">{{EMAIL}}</span>. Need a tool? Ask an admin.</span>
          <span class="hub-ft-ver">Portal <b>r87</b> · Aug 8, 2026</span>
        </div>
      </div>
    </div>
  </div>

  <nav class="hub-dock" aria-label="Phone navigation">
    <button type="button" class="hub-dock__btn is-active" data-dock="home">
      <span class="hub-dock__ico" aria-hidden="true">⌂</span>Home
    </button>
    <button type="button" class="hub-dock__btn" data-dock="search">
      <span class="hub-dock__ico" aria-hidden="true">⌕</span>Search
    </button>
    <button type="button" class="hub-dock__btn" data-dock="alerts" id="dockalerts">
      <span class="hub-dock__ico" aria-hidden="true">●</span>Alerts
      <span class="hub-dock__badge" id="alertbadge" hidden>0</span>
    </button>
    <button type="button" class="hub-dock__btn" data-dock="tools">
      <span class="hub-dock__ico" aria-hidden="true">☰</span>Tools
    </button>
  </nav>
</div>

<div class="hub-toast" id="toast" role="status"></div>

<div class="hub-drawer-backdrop" id="drawerbk" hidden></div>
<aside class="hub-drawer" id="drawer" aria-label="Tools drawer" hidden>
  <div class="hub-rail__brand">
    <span class="hub-rail__mark">G</span>
    <span class="hub-rail__word">Green Valley</span>
  </div>
  <div class="hub-rail__search">
    <input type="search" id="drawersearch" placeholder="Find a tool" autocomplete="off" />
  </div>
  <nav class="hub-rail__nav" id="drawernav"></nav>
  <div class="hub-rail__user">
    <span class="hub-avatar" id="draweravatar">?</span>
    <div class="hub-rail__user-meta">
      <div class="hub-rail__user-name" id="drawername">…</div>
      <div class="hub-rail__user-role" id="drawerrole"></div>
    </div>
    <button type="button" class="hub-rail__signout" id="theme-toggle-drawer" data-theme-label>Auto</button>
    <a class="hub-rail__signout" href="/auth/logout">Sign out</a>
  </div>
</aside>

<script src="/ui/gvc-theme.js"></script>
<script>
(function () {
  "use strict";
  if (window.GvcTheme) {
    window.GvcTheme.mount(document.getElementById("theme-toggle-rail"));
    window.GvcTheme.mount(document.getElementById("theme-toggle-drawer"));
  }
  const FEATURES = new Set({{FEATURES_JSON}});
  const EMAIL = {{EMAIL_JSON}};
  const RECENT_KEY = "gvc_hub_recent_v1";
  const BADGE_MS = 60 * 1000;
  const REFRESH_MIN_MS = 30 * 1000;
  let lastRefreshAt = 0;

  let payload = null;
  let drawerOpen = false;
  let pinBusy = false;
  const wantDemo = /(?:\?|&)demo=1(?:&|$)/.test(location.search);

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function $(id) { return document.getElementById(id); }

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("is-on");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove("is-on"), 2200);
  }

  function loadRecent() {
    try {
      const raw = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");
      return Array.isArray(raw) ? raw.filter((x) => x && x.href && x.name).slice(0, 5) : [];
    } catch (_) { return []; }
  }

  function pushRecent(tool) {
    if (!tool || !tool.granted) return;
    const cur = loadRecent().filter((t) => t.href !== tool.href);
    cur.unshift({ name: tool.name, href: tool.href, external: !!tool.external });
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(cur.slice(0, 5))); } catch (_) {}
  }

  function flatTools() {
    const groups = (payload && payload.nav && payload.nav.groups) || [];
    return groups.flatMap((g) => g.tools || []);
  }

  function pinIds() {
    return new Set((payload.pinned || []).map((p) => p.id || p.href));
  }

  function badgeFor(feature) {
    const b = (payload && payload.badges) || {};
    const n = b[feature];
    return typeof n === "number" && n > 0 ? n : 0;
  }

  const SETUP_TITLES = {
    timeoff: "Time Off form URL not set — ask an admin",
    coi: "COI blank not uploaded — open Admin to add it",
    admin: "Grant editing needs the GCS backend — env mode is read-only",
  };

  function setupNeeds(feature) {
    const s = (payload && payload.setup) || {};
    return !!s[feature];
  }

  function railBadge(feature, granted) {
    if (!granted) {
      return `<span class="hub-rail__badge is-dash">—</span>`;
    }
    if (setupNeeds(feature)) {
      const tip = SETUP_TITLES[feature] || "Needs setup before this tool works";
      return `<span class="hub-rail__badge is-setup" title="${esc(tip)}">Setup</span>`;
    }
    const n = badgeFor(feature);
    return n ? `<span class="hub-rail__badge">${n}</span>` : "";
  }

  function renderNav(into, filter) {
    const groups = (payload && payload.nav && payload.nav.groups) || [];
    const q = (filter || "").trim().toLowerCase();
    const html = [];
    html.push(
      `<div class="hub-rail__group"><span class="hub-rail__ghead">Home</span>` +
      `<a class="hub-rail__item is-active" href="/" data-home="1">` +
      `<span class="hub-rail__item-name">Your hub</span></a></div>`
    );
    groups.forEach((g) => {
      const tools = (g.tools || []).filter((t) =>
        !q || t.name.toLowerCase().includes(q) || t.feature.toLowerCase().includes(q)
      );
      if (!tools.length) return;
      html.push(`<div class="hub-rail__group"><span class="hub-rail__ghead">${esc(g.name)}</span>`);
      tools.forEach((t) => {
        const granted = !!t.granted;
        const badge = railBadge(t.feature, granted);
        const cls = "hub-rail__item" + (granted ? "" : " is-dim");
        if (granted) {
          const ext = t.external ? ` target="_blank" rel="noopener noreferrer"` : "";
          html.push(
            `<a class="${cls}" href="${esc(t.href)}" data-feature="${esc(t.feature)}"${ext}>` +
            `<span class="hub-rail__item-name">${esc(t.name)}</span>${badge}</a>`
          );
        } else {
          html.push(
            `<span class="${cls}" role="button" tabindex="0" title="Ask an admin for access" data-feature="${esc(t.feature)}" data-denied="1">` +
            `<span class="hub-rail__item-name">${esc(t.name)}</span>${badge}</span>`
          );
        }
      });
      html.push("</div>");
    });
    into.innerHTML = html.join("") || `<div class="hub-empty-soft">No tools match.</div>`;
    into.querySelectorAll("a.hub-rail__item[data-feature]").forEach((a) => {
      a.addEventListener("click", () => {
        const feat = a.getAttribute("data-feature");
        const tool = flatTools().find((t) => t.feature === feat && t.href === a.getAttribute("href"));
        if (tool) pushRecent(tool);
        setDrawer(false);
      });
    });
    // Dimmed tools used to be silent — users thought the app was broken.
    into.querySelectorAll(".hub-rail__item[data-denied]").forEach((el) => {
      const deny = () => toast("Ask an admin for access to this tool");
      el.addEventListener("click", deny);
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); deny(); }
      });
    });
  }

  function isUrgentKind(kind) {
    const k = String(kind || "").toLowerCase();
    return k === "safety" || k === "blocked" || k === "stop-work" || k === "overdue";
  }

  function formatWhen(raw) {
    if (!raw) return "";
    const s = String(raw);
    const d = new Date(s);
    if (Number.isNaN(d.getTime())) return s.length > 24 ? s.slice(0, 24) : s;
    try {
      return d.toLocaleString("en-US", {
        timeZone: "America/New_York",
        month: "short", day: "numeric",
        hour: "numeric", minute: "2-digit",
      });
    } catch (_) {
      return s.slice(0, 24);
    }
  }

  function formatDateLine(iso) {
    const d = iso ? new Date(iso) : new Date();
    if (Number.isNaN(d.getTime())) return "";
    try {
      return d.toLocaleDateString("en-US", {
        timeZone: "America/New_York",
        weekday: "long", month: "long", day: "numeric",
      });
    } catch (_) {
      return "";
    }
  }

  function renderNeeds() {
    const box = $("needs");
    const countEl = $("needscount");
    if (!payload) return;
    const list = payload.needs || [];
    // Only trust the server clear flag — empty + not-clear means data is down.
    const clear = !!payload.needs_clear;
    if (countEl) {
      if (!clear && list.length) {
        countEl.hidden = false;
        countEl.textContent = String(list.length);
      } else {
        countEl.hidden = true;
        countEl.textContent = "";
      }
    }
    const hasUrgent = !clear && list.some((n) => n.urgent || isUrgentKind(n.kind));
    const kick = $("needs-kicker");
    if (kick) kick.classList.toggle("has-urgent", !!hasUrgent);
    const app = $("app");
    if (app) app.classList.toggle("is-alerts", !!hasUrgent);
    const badge = $("alertbadge");
    if (badge) badge.classList.toggle("is-urgent", !!hasUrgent);
    if (clear) {
      const line = (payload.summary || "You're clear.").trim();
      const rest = line.replace(/^you['\u2019]?re clear[.!\u2014\u2013\s-]*/i, "").trim();
      box.innerHTML =
        `<div class="hub-clear"><strong>You're clear.</strong>` +
        (rest ? esc(rest) : "") + `</div>`;
      return;
    }
    if (!list.length) {
      const line = (payload.summary ||
        "Live numbers aren't available yet — tools still work from the rail.").trim();
      box.innerHTML =
        `<div class="hub-empty-soft"><strong>Waiting on live data</strong>` +
        esc(line) + `</div>`;
      return;
    }
    box.innerHTML = `<div class="hub-needs">` + list.map((n) => {
      const urgent = n.urgent || isUrgentKind(n.kind);
      const sec = n.secondary_href
        ? `<a class="btn btn--ghost" href="${esc(n.secondary_href)}">Open job</a>`
        : "";
      return (
        `<article class="hub-need${urgent ? " is-urgent" : ""}">` +
        `<div class="hub-need__top">` +
        `<span class="hub-need__kind${urgent ? " is-urgent" : ""}">${esc(n.kind)}</span>` +
        `<span class="hub-need__amount">${esc(n.amount)}</span></div>` +
        `<h3 class="hub-need__title">${esc(n.title)}</h3>` +
        `<p class="hub-need__detail">${esc(n.detail)}</p>` +
        `<div class="hub-need__actions">` +
        `<a class="btn btn--primary" href="${esc(n.href)}">${esc(n.action || "Open")}</a>` +
        sec + `</div></article>`
      );
    }).join("") + `</div>`;
  }

  function renderMetrics() {
    $("metrics").innerHTML = (payload.metrics || []).map((m) => {
      const unavailable = m.unavailable || m.value === "—";
      const zero = !unavailable && (m.zero || m.value === 0 || m.value === "0");
      const live = !unavailable && !zero && m.value != null && m.value !== "";
      const cls = [
        "hub-metric",
        zero ? "is-zero" : "",
        unavailable ? "is-unavailable" : "",
        live ? "is-live" : "",
      ].filter(Boolean).join(" ");
      return (
        `<div class="${cls}">` +
        `<div class="hub-metric__label">${esc(m.label)}</div>` +
        `<div class="hub-metric__value">${esc(m.value)}</div>` +
        `<div class="hub-metric__foot">${esc(m.foot)}</div></div>`
      );
    }).join("");
  }

  function rowHtml(r, { pinable }) {
    const id = r.id || r.href || "";
    const on = pinIds().has(id);
    const pinBtn = pinable
      ? `<button type="button" class="hub-pin${on ? " is-on" : ""}" data-pin="${esc(id)}" ` +
        `aria-label="${on ? "Unpin" : "Pin"}" aria-pressed="${on ? "true" : "false"}" ` +
        `title="${on ? "Unpin" : "Pin"}">${on ? "★" : "☆"}</button>`
      : "";
    const tag = r.tag
      ? `<span class="hub-qrow__tag${r.flagged ? " is-flag" : ""}">${esc(r.tag)}</span>`
      : "";
    return (
      `<div class="hub-qrow">` +
      `<a class="hub-qrow__meta" href="${esc(r.href || "#")}">` +
      `<div class="hub-qrow__name">${esc(r.name)}</div>` +
      `<div class="hub-qrow__sub">${esc(r.sub || "")}</div></a>` +
      tag + pinBtn + `</div>`
    );
  }

  function renderQueue() {
    const q = payload.queue || {};
    $("queue-title").textContent = q.title || "Queue";
    const link = $("queuelink");
    link.href = q.href || "#";
    link.textContent = q.link || "Open";
    const rows = q.rows || [];
    if (!rows.length) {
      $("queue").innerHTML =
        `<div class="hub-empty-soft"><strong>Queue is empty</strong>` +
        `When something needs you, it lands here.</div>`;
      return;
    }
    $("queue").innerHTML = rows.map((r) => rowHtml(r, { pinable: true })).join("");
    wirePins($("queue"));
  }

  function renderPinned() {
    const rows = payload.pinned || [];
    if (!rows.length) {
      $("pinned").innerHTML =
        `<div class="hub-empty-soft"><strong>No pins yet</strong>` +
        `Tap ★ on a queue row to keep a job here.</div>`;
      return;
    }
    $("pinned").innerHTML = rows.map((r) => rowHtml(r, { pinable: true })).join("");
    wirePins($("pinned"));
  }

  function wirePins(root) {
    root.querySelectorAll("[data-pin]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        togglePin(btn.getAttribute("data-pin"));
      });
    });
  }

  async function togglePin(id) {
    if (!id || pinBusy || !payload) return;
    const cur = (payload.pinned || []).slice();
    const idx = cur.findIndex((p) => (p.id || p.href) === id);
    let next;
    if (idx >= 0) {
      next = cur.filter((_, i) => i !== idx);
    } else {
      const fromQ = ((payload.queue || {}).rows || []).find((r) => (r.id || r.href) === id);
      const fromP = cur.find((p) => (p.id || p.href) === id);
      const src = fromQ || fromP;
      if (!src) return;
      next = cur.concat([{
        id: src.id || src.href,
        name: src.name,
        sub: src.sub || "",
        href: src.href || "#",
      }]);
    }
    payload.pinned = next;
    renderPinned();
    renderQueue();
    pinBusy = true;
    try {
      const res = await fetch("/ui/api/hub/pinned", {
        method: "PUT",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items: next }),
      });
      if (!res.ok) throw new Error("pin " + res.status);
      const body = await res.json();
      payload.pinned = body.items || next;
      renderPinned();
      renderQueue();
      if (body.persisted === false) {
        toast(idx >= 0 ? "Unpinned for now — not saved yet" : "Pinned for now — not saved yet");
      } else {
        toast(idx >= 0 ? "Unpinned" : "Pinned");
      }
    } catch (_) {
      toast("Couldn't save pin — try again");
      fetchPayload().catch(() => {});
    } finally {
      pinBusy = false;
    }
  }

  function renderActivity() {
    const allLink = $("activityall");
    const hasActivity = FEATURES.has("activity") || FEATURES.has("*");
    if (allLink) {
      if (hasActivity) {
        allLink.hidden = false;
        allLink.href = "/ui/activity";
        allLink.removeAttribute("aria-disabled");
        allLink.title = "";
      } else {
        allLink.hidden = false;
        allLink.href = "#";
        allLink.setAttribute("aria-disabled", "true");
        allLink.title = "Ask an admin for Activity access";
        allLink.onclick = (e) => {
          e.preventDefault();
          toast("Ask an admin for Activity access");
        };
      }
    }
    const rows = payload.activity || [];
    if (!rows.length) {
      $("activity").innerHTML =
        `<div class="hub-empty-soft"><strong>Quiet so far</strong>` +
        (hasActivity
          ? `Sends, approvals, and status changes show up here.`
          : `Your recent work shows here when available. Ask an admin for the full Activity log.`) +
        `</div>`;
      return;
    }
    $("activity").innerHTML = rows.map((r) => (
      `<a class="hub-act" href="${esc(r.href || (hasActivity ? "/ui/activity" : "#"))}">` +
      `<div class="hub-act__text">${esc(r.text)}</div>` +
      `<div class="hub-act__when">${esc(formatWhen(r.when))}</div></a>`
    )).join("");
  }

  function renderHomeCta() {
    const wrap = $("homectawrap");
    const cta = $("homecta");
    const u = payload.user || {};
    if (!wrap || !cta) return;
    if (!u.homeHref) {
      wrap.hidden = true;
      return;
    }
    wrap.hidden = false;
    cta.href = u.homeHref;
    cta.textContent = "Open " + (u.homeToolName || "home tool");
    // Quiet outline when needs compete for attention; solid when clear.
    const busy = !payload.needs_clear && (payload.needs || []).length > 0;
    cta.classList.toggle("hub-home-cta--quiet", busy);
  }

  function setDockActive(mode) {
    document.querySelectorAll("[data-dock]").forEach((b) => {
      b.classList.toggle("is-active", b.getAttribute("data-dock") === mode);
    });
  }

  function renderRecent() {
    const recent = loadRecent();
    const u = payload.user || {};
    const homeName = u.homeToolName || "Your home tool";
    const home = u.homeHref
      ? { name: homeName, href: u.homeHref, granted: true }
      : null;
    const items = recent.length ? recent : (home ? [home] : []);
    if (!items.length) {
      $("recent").innerHTML =
        `<div class="hub-empty-soft"><strong>No recent tools</strong>` +
        `Tools you open will land here.</div>`;
      return;
    }
    $("recent").innerHTML = items.map((t) => {
      const ext = t.external ? ` target="_blank" rel="noopener noreferrer"` : "";
      return `<a href="${esc(t.href)}"${ext}>${esc(t.name)}</a>`;
    }).join("");
  }

  function renderUserChrome() {
    const u = payload.user || {};
    ["rail", "drawer", "top"].forEach((prefix) => {
      const av = $(prefix === "top" ? "topavatar" : prefix + "avatar");
      if (av) av.textContent = u.initials || "?";
    });
    ["rail", "drawer"].forEach((prefix) => {
      const nm = $(prefix + "name");
      const rl = $(prefix + "role");
      if (nm) nm.textContent = u.name || EMAIL;
      if (rl) rl.textContent = u.title || u.role || "";
    });
    const nNeeds = (payload.needs || []).length;
    const badge = $("alertbadge");
    if (badge) {
      if (nNeeds > 0 && !payload.needs_clear) {
        badge.hidden = false;
        badge.textContent = String(nNeeds);
      } else {
        badge.hidden = true;
      }
    }
  }

  function showLive() {
    const sk = $("skel");
    const live = $("hublive");
    if (sk) sk.hidden = true;
    if (live) live.hidden = false;
  }

  function renderAll() {
    showLive();
    $("greeting").textContent = payload.greeting || "Hello.";
    const dl = $("dateline");
    if (dl) dl.textContent = formatDateLine(payload.generated_at);
    // When clear, summary lives inside the clear banner — don't duplicate.
    $("summary").textContent = payload.needs_clear ? "" : (payload.summary || "");
    renderHomeCta();
    renderUserChrome();
    renderNav($("railnav"));
    renderNav($("drawernav"));
    renderNeeds();
    renderMetrics();
    renderQueue();
    renderPinned();
    renderActivity();
    renderRecent();
  }

  function demoPayload() {
    const base = payload || {};
    const u = Object.assign({}, base.user || {}, {
      name: (base.user && base.user.name) || "Jordan Faulkner",
      initials: (base.user && base.user.initials) || "JF",
      title: (base.user && base.user.title) || "Owner",
      homeToolName: (base.user && base.user.homeToolName) || "Owner Pulse",
      homeHref: (base.user && base.user.homeHref) || "/ui/morning-owner",
    });
    return Object.assign({}, base, {
      user: u,
      greeting: "Good afternoon, Jordan.",
      generated_at: new Date().toISOString(),
      summary: "3 exceptions need you today.",
      needs_clear: false,
      needs: [
        {
          kind: "Safety", amount: "Stop-work", urgent: true,
          title: "21435 Abbys | Greg Gavin",
          detail: "Safety hold on Operations — clear before the crew mobilizes.",
          action: "Open Owner Pulse", href: "/ui/morning-owner",
          secondary_href: "/ui/jobcheck",
        },
        {
          kind: "Invoice", amount: "2 ready",
          title: "Jobs ready to invoice",
          detail: "Complete work waiting on an invoice draft — approve to send.",
          action: "Approve to send", href: "/ui/billing",
        },
        {
          kind: "Handoff", amount: "1",
          title: "Accepted bid needs Job Start",
          detail: "Won deal without a Projects item — hand off before billing.",
          action: "Open Job Start", href: "/ui/jobstart",
        },
      ],
      metrics: [
        { label: "Ready to invoice", value: 2, foot: "unbilled complete / ready", zero: false, unavailable: false },
        { label: "Team prep", value: "86%", foot: "ops ready for huddle", zero: false, unavailable: false },
        { label: "Safety / stop-work", value: 1, foot: "owner-visible holds", zero: false, unavailable: false },
        { label: "Planning flags", value: 0, foot: "route override signals", zero: true, unavailable: false },
      ],
      queue: {
        title: "Exceptions",
        link: "Open Owner Pulse",
        href: "/ui/morning-owner",
        rows: [
          { id: "demo-1", name: "21435 Abbys | Greg Gavin", sub: "Safety hold", tag: "Flag", flagged: true, href: "/ui/jobcheck?item=demo-1" },
          { id: "demo-2", name: "9761 Gertrude | Tedesco", sub: "Ready to invoice", tag: "Ready", href: "/ui/billing" },
          { id: "demo-3", name: "937 Madison Ridge | Kaiker", sub: "Needs handoff", tag: "Handoff", flagged: true, href: "/ui/jobstart?bid=demo-3" },
        ],
      },
      pinned: [
        { id: "demo-1", name: "21435 Abbys | Greg Gavin", sub: "Safety hold", href: "/ui/jobcheck?item=demo-1" },
      ],
      activity: [
        { text: "Job check · 21435 Abbys", when: new Date(Date.now() - 3600000).toISOString(), href: "/ui/activity" },
        { text: "Invoice · GVC-2026-C-012", when: new Date(Date.now() - 7200000).toISOString(), href: "/ui/activity" },
        { text: "Estimate Slack notice · 2026-0806-001", when: new Date(Date.now() - 86400000).toISOString(), href: "/ui/activity" },
      ],
      badges: { invoice: 2, morning_owner: 1, jobstart: 1 },
    });
  }

  function setDrawer(open) {
    drawerOpen = !!open;
    const d = $("drawer");
    const bk = $("drawerbk");
    d.hidden = false;
    bk.hidden = false;
    d.classList.toggle("is-open", drawerOpen);
    bk.classList.toggle("is-open", drawerOpen);
    if (!drawerOpen) {
      setTimeout(() => { d.hidden = true; bk.hidden = true; }, 180);
    }
  }

  function wireChrome() {
    $("menubtn").addEventListener("click", () => setDrawer(true));
    $("drawerbk").addEventListener("click", () => setDrawer(false));
    $("railsearch").addEventListener("input", (e) => renderNav($("railnav"), e.target.value));
    $("drawersearch").addEventListener("input", (e) => renderNav($("drawernav"), e.target.value));
    $("mobilesearch").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      const hits = flatTools().filter((t) =>
        t.granted && (!q || t.name.toLowerCase().includes(q))
      ).slice(0, 12);
      $("searchhits").innerHTML = hits.map((t) => {
        const ext = t.external ? ` target="_blank" rel="noopener noreferrer"` : "";
        return `<a class="hub-qrow" href="${esc(t.href)}"${ext}>` +
          `<div class="hub-qrow__meta"><div class="hub-qrow__name">${esc(t.name)}</div></div></a>`;
      }).join("") || `<div class="hub-empty-soft">No tools match that search.</div>`;
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        $("searchpanel").classList.remove("is-open");
        setDrawer(false);
        setDockActive("home");
      }
    });

    document.querySelectorAll("[data-dock]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const mode = btn.getAttribute("data-dock");
        if (mode === "tools") {
          setDockActive("tools");
          setDrawer(true);
          return;
        }
        if (mode === "search") {
          setDockActive("search");
          $("searchpanel").classList.add("is-open");
          $("mobilesearch").focus();
          window.scrollTo({ top: 0, behavior: "smooth" });
          return;
        }
        if (mode === "alerts") {
          setDockActive("alerts");
          $("searchpanel").classList.remove("is-open");
          $("needs-kicker").scrollIntoView({ behavior: "smooth", block: "start" });
          const kick = $("needs-kicker");
          if (kick) {
            kick.classList.add("is-flash");
            setTimeout(() => kick.classList.remove("is-flash"), 900);
          }
          return;
        }
        setDockActive("home");
        $("searchpanel").classList.remove("is-open");
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
  }

  function applyRefreshSlice(next) {
    if (!payload) payload = {};
    payload.badges = next.badges || {};
    payload.setup = next.setup || {};
    payload.needs = next.needs || payload.needs || [];
    payload.needs_clear = next.needs_clear;
    payload.summary = next.summary != null ? next.summary : (payload.summary || "");
    payload.metrics = next.metrics || payload.metrics || [];
    payload.queue = next.queue || payload.queue || { title: "Queue", rows: [] };
    if (next.generated_at) payload.generated_at = next.generated_at;
  }

  function renderLiveSlice() {
    // First paint / light poll — needs, metrics, queue, badges only.
    showLive();
    $("summary").textContent = payload.needs_clear ? "" : (payload.summary || "");
    const dl = $("dateline");
    if (dl && payload.generated_at) dl.textContent = formatDateLine(payload.generated_at);
    renderUserChrome();
    renderNeeds();
    renderMetrics();
    renderQueue();
    renderHomeCta();
  }

  async function fetchPayload() {
    // One Monday walk on first paint. /ui/api/hub/refresh runs the SAME
    // brief+billing slice as /ui/api/hub — calling both on boot doubled
    // cold GraphQL cost. Polls still use refresh (skips Cloud Logging).
    const res = await fetch("/ui/api/hub", { credentials: "same-origin" });
    if (!res.ok) throw new Error("hub " + res.status);
    payload = await res.json();
    lastRefreshAt = Date.now();
    if (payload.nav && Array.isArray(payload.nav.features)) {
      payload.nav.features.forEach((f) => FEATURES.add(f));
    }
    if (payload.monday_trace && typeof console !== "undefined" && console.info) {
      console.info("[gvc monday_trace]", payload.monday_trace);
    }
    renderAll();
  }

  async function refreshBadges(force) {
    if (wantDemo) return;
    const now = Date.now();
    if (!force && lastRefreshAt && (now - lastRefreshAt) < REFRESH_MIN_MS) return;
    lastRefreshAt = now;
    try {
      // Light poll — badges/needs/queue only. Full /ui/api/hub re-hits Cloud
      // Logging activity on every tick; that made an idle hub feel heavy.
      const res = await fetch("/ui/api/hub/refresh", { credentials: "same-origin" });
      if (!res.ok) return;
      const next = await res.json();
      if (next.ok === false && !next.badges && !(next.needs || []).length) return;
      applyRefreshSlice(next);
      renderUserChrome();
      renderNav($("railnav"), $("railsearch").value);
      renderNav($("drawernav"), $("drawersearch").value);
      renderNeeds();
      renderMetrics();
      renderQueue();
      renderPinned();
      renderHomeCta();
      $("summary").textContent = payload.needs_clear ? "" : (payload.summary || "");
    } catch (_) {}
  }

  function warmMondayAfterPaint() {
    // After first hub JSON — not concurrent with it. Warm force-refreshes
    // board walks and used to stampede Monday on cold boot next to /hub.
    fetch("/ui/api/monday/warm", {
      method: "POST", credentials: "same-origin", keepalive: true
    }).catch(() => {});
  }

  wireChrome();
  fetchPayload()
    .then(() => {
      if (wantDemo) {
        payload = demoPayload();
        renderAll();
      }
      warmMondayAfterPaint();
    })
    .catch((err) => {
      showLive();
      $("greeting").textContent = "Couldn't load your hub";
      const dl = $("dateline");
      if (dl) dl.textContent = "";
      $("summary").textContent = String(err.message || err);
      const wrap = $("homectawrap");
      if (wrap) wrap.hidden = true;
      warmMondayAfterPaint();
    });

  setInterval(() => refreshBadges(false), BADGE_MS);
  window.addEventListener("focus", () => refreshBadges(false));
})();
</script>
</body>
</html>
