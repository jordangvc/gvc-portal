<!DOCTYPE html>
<html lang="en" data-palette="emerald">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GVC · Your hub</title>
<script>
/* FOUC-safe theme boot — same key as /ui/gvc-theme.js (gvc-theme). */
(function () {
  try {
    var k = "gvc-theme", v = localStorage.getItem(k);
    var mode = (v === "light" || v === "dark" || v === "system") ? v : "system";
    var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    var theme = mode === "light" ? "light" : mode === "dark" ? "dark" : (dark ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
    document.documentElement.setAttribute("data-theme-mode", mode);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "light");
  }
})();
</script>
<link rel="stylesheet" href="/ui/gvc-ui.css" />
</head>
<body>

<div class="app" id="app">
  <aside class="rail" id="rail" aria-label="Tools">
    <div class="rail__head">
      <div class="cluster-split">
        <a class="kicker" href="/" style="text-decoration:none;color:inherit">GVC Hub</a>
        <button type="button" class="btn btn-icon btn-ghost phone-only" id="rail-close" aria-label="Close menu">&times;</button>
      </div>
      <div class="rail__job">All tools</div>
      <input type="search" id="railsearch" placeholder="Find a tool" autocomplete="off" aria-label="Find a tool" />
    </div>
    <nav class="rail__nav" id="railnav" aria-label="Tools"></nav>
    <div class="rail__foot">
      <span class="avatar" id="railavatar" aria-hidden="true">?</span>
      <span class="row__main">
        <b class="row__title" id="railname">…</b>
        <span class="row__sub" id="railrole"></span>
      </span>
      <button type="button" class="btn btn-sm btn-ghost" id="theme-toggle" data-theme-label>Auto</button>
      <a class="btn btn-sm btn-ghost" href="/auth/logout">Sign out</a>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <button type="button" class="btn btn-icon phone-only" id="menubtn" aria-label="All tools">&#8801;</button>
      <div class="topbar__title">
        <span class="kicker" id="dateline">Today</span>
        <h1>Your hub</h1>
      </div>
      <div class="topbar__actions">
        <span class="avatar" id="topavatar" aria-hidden="true">?</span>
      </div>
    </header>

    <div class="page" id="home">
      <div id="searchpanel" hidden>
        <section class="stack" style="gap:var(--space-3)">
          <input type="search" id="mobilesearch" placeholder="Find a tool" autocomplete="off" aria-label="Find a tool" />
          <div class="card card-flush" id="searchhits"></div>
        </section>
      </div>

      <div id="skel" hidden aria-hidden="true">
        <div class="stack" style="gap:var(--space-4)">
          <span class="skel skel-title"></span>
          <span class="skel skel-sub"></span>
          <div class="grid-cards">
            <span class="skel skel-row"></span>
            <span class="skel skel-row"></span>
          </div>
          <div class="grid-metrics">
            <span class="skel skel-row"></span>
            <span class="skel skel-row"></span>
            <span class="skel skel-row"></span>
            <span class="skel skel-row"></span>
          </div>
        </div>
      </div>

      <!-- Instant shell: greeting / quick actions / recent paint from HUB_BOOT
           before Monday. Needs/metrics/queue hydrate when /ui/api/hub returns. -->
      <div id="hublive">
        <section class="stack" style="gap:var(--space-2)">
          <p id="greeting" style="font-family:var(--font-display);font-size:var(--text-lg);font-weight:600;margin:0"></p>
          <p class="muted" id="summary" style="margin:0;max-width:52ch"></p>
          <div id="homectawrap" hidden>
            <a class="btn btn-primary hub-home-cta" id="homecta" href="#">Open</a>
          </div>
        </section>

        <section class="stack" style="gap:var(--space-3)" aria-labelledby="quick-kicker" id="quicksection">
          <span class="kicker" id="quick-kicker">Do next</span>
          <div class="cluster" id="quickactions"></div>
        </section>

        <section class="stack" style="gap:var(--space-3)" aria-labelledby="recent-kicker">
          <span class="kicker" id="recent-kicker">Jump back in</span>
          <div class="chipset">
            <div class="chipset__opts" id="recent"></div>
          </div>
        </section>

        <section class="stack" style="gap:var(--space-3)" aria-labelledby="needs-kicker">
          <div class="cluster-split">
            <span class="kicker" id="needs-kicker">Needs you today</span>
            <span class="badge" id="needscount" hidden></span>
          </div>
          <div id="needs"></div>
        </section>

        <section class="stack" style="gap:var(--space-3)" aria-labelledby="metrics-kicker">
          <span class="kicker" id="metrics-kicker">At a glance</span>
          <div class="grid-metrics" id="metrics"></div>
        </section>

        <div class="grid-split">
          <section class="card card-flush" aria-labelledby="queue-title">
            <div class="card-head">
              <div class="row__main">
                <h2 id="queue-title">Queue</h2>
              </div>
              <a id="queuelink" href="#">Open</a>
            </div>
            <div class="scroll-rows" id="queue"></div>
          </section>

          <div class="stack" style="gap:var(--space-5)">
            <section class="card card-flush" aria-labelledby="pinned-title">
              <div class="card-head">
                <div class="row__main">
                  <h2 id="pinned-title">Pinned</h2>
                </div>
              </div>
              <div class="scroll-rows" id="pinned"></div>
            </section>
            <section class="card card-flush" aria-labelledby="activity-title">
              <div class="card-head">
                <div class="row__main">
                  <h2 id="activity-title">Activity</h2>
                </div>
                <a id="activityall" href="/ui/activity">All</a>
              </div>
              <div class="scroll-rows" id="activity"></div>
            </section>
          </div>
        </div>

        <p class="muted" style="font-size:var(--text-xs);margin:0">
          Signed in as <span id="emailnote">{{EMAIL}}</span>. Need a tool? Ask an admin.
          <span style="float:right">Portal <b>r105</b> · Aug 8, 2026</span>
        </p>
      </div>
    </div>

    <nav class="tabbar" aria-label="Phone navigation">
      <a href="#home" class="is-active" data-dock="home">Home</a>
      <a href="#search" data-dock="search">Search</a>
      <a href="#alerts" data-dock="alerts" id="dockalerts">Alerts<span class="badge" id="alertbadge" hidden>0</span></a>
      <a href="#tools" data-dock="tools" id="tools">Tools</a>
    </nav>
  </main>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="/ui/gvc-theme.js"></script>
<script>
(function () {
  "use strict";
  if (window.GvcTheme) {
    window.GvcTheme.mount(document.getElementById("theme-toggle"));
  }
  const FEATURES = new Set({{FEATURES_JSON}});
  const EMAIL = {{EMAIL_JSON}};
  const HUB_BOOT = {{HUB_BOOT_JSON}};
  const RECENT_KEY = "gvc_hub_recent_v1";
  const BADGE_MS = 60 * 1000;
  const REFRESH_MIN_MS = 30 * 1000;
  let lastRefreshAt = 0;
  let liveHydrated = false;

  let payload = null;
  let pinBusy = false;
  const wantDemo = /(?:\?|&)demo=1(?:&|$)/.test(location.search);

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function $(id) { return document.getElementById(id); }

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("is-on");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove("is-on"), 2200);
  }

  function loadRecent() {
    try {
      const raw = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");
      return Array.isArray(raw) ? raw.filter((x) => x && x.href && x.name).slice(0, 5) : [];
    } catch (_) { return []; }
  }

  function pushRecent(tool) {
    if (!tool || !tool.granted) return;
    const cur = loadRecent().filter((t) => t.href !== tool.href);
    cur.unshift({ name: tool.name, href: tool.href, external: !!tool.external });
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(cur.slice(0, 5))); } catch (_) {}
  }

  function flatTools() {
    const groups = (payload && payload.nav && payload.nav.groups) || [];
    return groups.flatMap((g) => g.tools || []);
  }

  function pinIds() {
    return new Set((payload.pinned || []).map((p) => p.id || p.href));
  }

  function badgeFor(feature) {
    const b = (payload && payload.badges) || {};
    const n = b[feature];
    return typeof n === "number" && n > 0 ? n : 0;
  }

  const SETUP_TITLES = {
    timeoff: "Time Off form URL not set — ask an admin",
    coi: "COI blank not uploaded — open Admin to add it",
    admin: "Grant editing needs the GCS backend — env mode is read-only",
  };

  function setupNeeds(feature) {
    const s = (payload && payload.setup) || {};
    return !!s[feature];
  }

  function railBadge(feature, granted) {
    if (!granted) {
      return `<span class="faint" aria-hidden="true">&mdash;</span>`;
    }
    if (setupNeeds(feature)) {
      const tip = SETUP_TITLES[feature] || "Needs setup before this tool works";
      return `<span class="tag tag-gold is-setup" title="${esc(tip)}">Setup</span>`;
    }
    const n = badgeFor(feature);
    return n ? `<span class="badge">${n}</span>` : "";
  }

  function setDrawer(open) {
    const rail = $("rail");
    if (!rail) return;
    rail.classList.toggle("is-open", !!open);
  }

  function renderNav(into, filter) {
    const groups = (payload && payload.nav && payload.nav.groups) || [];
    const q = (filter || "").trim().toLowerCase();
    const html = [];
    html.push(
      `<div class="rail__group"><span class="kicker kicker-sm">Home</span>` +
      `<a class="nav-item is-active" href="/" data-home="1" aria-current="page">` +
      `<span class="nav-item__name">Your hub</span></a></div>`
    );
    groups.forEach((g) => {
      const tools = (g.tools || []).filter((t) =>
        !q || t.name.toLowerCase().includes(q) || t.feature.toLowerCase().includes(q)
      );
      if (!tools.length) return;
      html.push(`<div class="rail__group"><span class="kicker kicker-sm">${esc(g.name)}</span>`);
      tools.forEach((t) => {
        const granted = !!t.granted;
        const badge = railBadge(t.feature, granted);
        const cls = "nav-item" + (granted ? "" : " is-locked");
        if (granted) {
          const ext = t.external ? ` target="_blank" rel="noopener noreferrer"` : "";
          html.push(
            `<a class="${cls}" href="${esc(t.href)}" data-feature="${esc(t.feature)}"${ext}>` +
            `<span class="nav-item__name">${esc(t.name)}</span>${badge}</a>`
          );
        } else {
          html.push(
            `<span class="${cls}" role="button" tabindex="0" title="Ask an admin for access" data-feature="${esc(t.feature)}" data-denied="1">` +
            `<span class="nav-item__name">${esc(t.name)}</span>${badge}</span>`
          );
        }
      });
      html.push("</div>");
    });
    into.innerHTML = html.join("") ||
      `<div class="empty empty-inline"><div class="empty__title">No tools match</div></div>`;
    into.querySelectorAll("a.nav-item[data-feature]").forEach((a) => {
      a.addEventListener("click", () => {
        const feat = a.getAttribute("data-feature");
        const tool = flatTools().find((t) => t.feature === feat && t.href === a.getAttribute("href"));
        if (tool) pushRecent(tool);
        setDrawer(false);
      });
    });
    // Locked tools used to be silent — users thought the app was broken.
    into.querySelectorAll(".nav-item[data-denied]").forEach((el) => {
      const deny = () => toast("Ask an admin for access to this tool");
      el.addEventListener("click", deny);
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); deny(); }
      });
    });
  }

  function isUrgentKind(kind) {
    const k = String(kind || "").toLowerCase();
    return k === "safety" || k === "blocked" || k === "stop-work" || k === "overdue";
  }

  function formatWhen(raw) {
    if (!raw) return "";
    const s = String(raw);
    const d = new Date(s);
    if (Number.isNaN(d.getTime())) return s.length > 24 ? s.slice(0, 24) : s;
    try {
      return d.toLocaleString("en-US", {
        timeZone: "America/New_York",
        month: "short", day: "numeric",
        hour: "numeric", minute: "2-digit",
      });
    } catch (_) {
      return s.slice(0, 24);
    }
  }

  function formatDateLine(iso) {
    const d = iso ? new Date(iso) : new Date();
    if (Number.isNaN(d.getTime())) return "";
    try {
      return d.toLocaleDateString("en-US", {
        timeZone: "America/New_York",
        weekday: "long", month: "long", day: "numeric",
      });
    } catch (_) {
      return "";
    }
  }

  function renderNeeds() {
    const box = $("needs");
    const countEl = $("needscount");
    if (!payload) return;
    const list = payload.needs || [];
    // Only trust the server clear flag — empty + not-clear means data is down.
    const clear = !!payload.needs_clear;
    if (countEl) {
      if (!clear && list.length) {
        countEl.hidden = false;
        countEl.textContent = String(list.length);
      } else {
        countEl.hidden = true;
        countEl.textContent = "";
      }
    }
    if (clear) {
      const line = (payload.summary || "You're clear.").trim();
      const rest = line.replace(/^you['\u2019]?re clear[.!\u2014\u2013\s-]*/i, "").trim();
      box.innerHTML =
        `<div class="empty empty-clear empty-inline">` +
        `<div class="empty__title">You're clear.</div>` +
        (rest ? `<p class="empty__body">${esc(rest)}</p>` : "") +
        `</div>`;
      return;
    }
    if (!list.length) {
      if (!liveHydrated) {
        box.innerHTML =
          `<div class="empty empty-inline">` +
          `<div class="empty__title">Refreshing live needs…</div>` +
          `<p class="empty__body">Open a tool above anytime — you don't have to wait.</p></div>`;
        return;
      }
      const line = (payload.summary ||
        "Live numbers aren't available yet — tools still work from the rail.").trim();
      box.innerHTML =
        `<div class="empty empty-inline">` +
        `<div class="empty__title">Waiting on live data</div>` +
        `<p class="empty__body">${esc(line)}</p></div>`;
      return;
    }
    box.innerHTML = `<div class="grid-cards">` + list.map((n) => {
      const urgent = n.urgent || isUrgentKind(n.kind);
      const kindCls = urgent ? "tag tag-alert" : "kicker kicker-sm";
      const sec = n.secondary_href
        ? `<a class="btn" href="${esc(n.secondary_href)}">Open job</a>`
        : "";
      const amount = n.amount
        ? `<span class="num num-sm" style="color:var(--color-accent-ink)">${esc(n.amount)}</span>`
        : "";
      return (
        `<article class="card card-pad card-note stack" style="gap:var(--space-2)">` +
        `<div class="cluster-split">` +
        `<span class="${kindCls}">${esc(n.kind)}</span>${amount}</div>` +
        `<h3>${esc(n.title)}</h3>` +
        `<p class="muted" style="font-size:var(--text-sm);margin:0">${esc(n.detail)}</p>` +
        `<div class="cluster">` +
        `<a class="btn btn-primary" href="${esc(n.href)}">${esc(n.action || "Open")}</a>` +
        sec + `</div></article>`
      );
    }).join("") + `</div>`;
  }

  function renderMetrics() {
    const metrics = payload.metrics || [];
    if (!metrics.length && !liveHydrated) {
      $("metrics").innerHTML = [0, 1, 2, 3].map(() => (
        `<div class="card card-pad stack" style="gap:4px">` +
        `<span class="kicker kicker-sm">Live</span>` +
        `<span class="num num-lg muted">…</span>` +
        `<span class="muted" style="font-size:var(--text-xs)">loading</span></div>`
      )).join("");
      return;
    }
    $("metrics").innerHTML = metrics.map((m) => {
      const unavailable = m.unavailable || m.value === "—";
      const valCls = unavailable ? "num num-lg muted" : "num num-lg";
      return (
        `<div class="card card-pad stack" style="gap:4px">` +
        `<span class="kicker kicker-sm">${esc(m.label)}</span>` +
        `<span class="${valCls}">${esc(m.value)}</span>` +
        `<span class="muted" style="font-size:var(--text-xs)">${esc(m.foot)}</span></div>`
      );
    }).join("");
  }

  function renderQuickActions() {
    const box = $("quickactions");
    const sec = $("quicksection");
    if (!box) return;
    const actions = (payload && payload.quick_actions) || [];
    // Fall back to home CTA tools from nav when live payload has no quick_actions.
    let items = actions.slice();
    if (!items.length) {
      const u = (payload && payload.user) || {};
      if (u.homeHref) {
        items = [{ name: u.homeToolName || "Home tool", href: u.homeHref }];
      }
      const extras = flatTools().filter((t) => t.granted).slice(0, 3);
      extras.forEach((t) => {
        if (items.some((i) => i.href === t.href)) return;
        items.push({ name: t.name, href: t.href, feature: t.feature });
      });
      items = items.slice(0, 4);
    }
    if (!items.length) {
      if (sec) sec.hidden = true;
      return;
    }
    if (sec) sec.hidden = false;
    box.innerHTML = items.map((a, i) => {
      const cls = i === 0 ? "btn btn-primary" : "btn";
      return (
        `<a class="${cls}" href="${esc(a.href)}" ` +
        `data-feature="${esc(a.feature || "")}">${esc(a.name)}</a>`
      );
    }).join("");
    box.querySelectorAll("a[data-feature]").forEach((a) => {
      a.addEventListener("click", () => {
        const feat = a.getAttribute("data-feature");
        const tool = flatTools().find((t) => t.href === a.getAttribute("href"))
          || { name: a.textContent, href: a.getAttribute("href"), granted: true, feature: feat };
        pushRecent(tool);
      });
    });
  }

  function rowHtml(r, { pinable }) {
    const id = r.id || r.href || "";
    const on = pinIds().has(id);
    const pinBtn = pinable
      ? `<button type="button" class="btn btn-icon btn-ghost btn-sm row__end" data-pin="${esc(id)}" ` +
        `aria-label="${on ? "Unpin" : "Pin"}" aria-pressed="${on ? "true" : "false"}" ` +
        `title="${on ? "Unpin" : "Pin"}">${on ? "★" : "☆"}</button>`
      : "";
    const tag = r.tag
      ? `<span class="tag${r.flagged ? " tag-alert" : ""} row__end">${esc(r.tag)}</span>`
      : "";
    return (
      `<div class="row">` +
      `<a class="row__main" href="${esc(r.href || "#")}" style="text-decoration:none;color:inherit">` +
      `<b class="row__title">${esc(r.name)}</b>` +
      `<span class="row__sub">${esc(r.sub || "")}</span></a>` +
      tag + pinBtn + `</div>`
    );
  }

  function renderQueue() {
    const q = payload.queue || {};
    $("queue-title").textContent = q.title || "Queue";
    const link = $("queuelink");
    link.href = q.href || "#";
    link.textContent = q.link || "Open";
    const rows = q.rows || [];
    if (!rows.length) {
      $("queue").innerHTML =
        `<div class="empty empty-inline">` +
        `<div class="empty__title">Queue is empty</div>` +
        `<p class="empty__body">When something needs you, it lands here.</p></div>`;
      return;
    }
    $("queue").innerHTML = rows.map((r) => rowHtml(r, { pinable: true })).join("");
    wirePins($("queue"));
  }

  function renderPinned() {
    const rows = payload.pinned || [];
    if (!rows.length) {
      $("pinned").innerHTML =
        `<div class="empty empty-inline">` +
        `<div class="empty__title">No pins yet</div>` +
        `<p class="empty__body">Tap ★ on a queue row to keep a job here.</p></div>`;
      return;
    }
    $("pinned").innerHTML = rows.map((r) => rowHtml(r, { pinable: true })).join("");
    wirePins($("pinned"));
  }

  function wirePins(root) {
    root.querySelectorAll("[data-pin]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        togglePin(btn.getAttribute("data-pin"));
      });
    });
  }

  async function togglePin(id) {
    if (!id || pinBusy || !payload) return;
    const cur = (payload.pinned || []).slice();
    const idx = cur.findIndex((p) => (p.id || p.href) === id);
    let next;
    if (idx >= 0) {
      next = cur.filter((_, i) => i !== idx);
    } else {
      const fromQ = ((payload.queue || {}).rows || []).find((r) => (r.id || r.href) === id);
      const fromP = cur.find((p) => (p.id || p.href) === id);
      const src = fromQ || fromP;
      if (!src) return;
      next = cur.concat([{
        id: src.id || src.href,
        name: src.name,
        sub: src.sub || "",
        href: src.href || "#",
      }]);
    }
    payload.pinned = next;
    renderPinned();
    renderQueue();
    pinBusy = true;
    try {
      const res = await fetch("/ui/api/hub/pinned", {
        method: "PUT",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items: next }),
      });
      if (!res.ok) throw new Error("pin " + res.status);
      const body = await res.json();
      payload.pinned = body.items || next;
      renderPinned();
      renderQueue();
      if (body.persisted === false) {
        toast(idx >= 0 ? "Unpinned for now — not saved yet" : "Pinned for now — not saved yet");
      } else {
        toast(idx >= 0 ? "Unpinned" : "Pinned");
      }
    } catch (_) {
      toast("Couldn't save pin — try again");
      fetchPayload().catch(() => {});
    } finally {
      pinBusy = false;
    }
  }

  function renderActivity() {
    const allLink = $("activityall");
    const hasActivity = FEATURES.has("activity") || FEATURES.has("*");
    if (allLink) {
      if (hasActivity) {
        allLink.hidden = false;
        allLink.href = "/ui/activity";
        allLink.removeAttribute("aria-disabled");
        allLink.title = "";
        allLink.onclick = null;
      } else {
        allLink.hidden = false;
        allLink.href = "#";
        allLink.setAttribute("aria-disabled", "true");
        allLink.title = "Ask an admin for Activity access";
        allLink.onclick = (e) => {
          e.preventDefault();
          toast("Ask an admin for Activity access");
        };
      }
    }
    const rows = payload.activity || [];
    if (!rows.length) {
      $("activity").innerHTML =
        `<div class="empty empty-inline">` +
        `<div class="empty__title">Quiet so far</div>` +
        `<p class="empty__body">` +
        (hasActivity
          ? `Sends, approvals, and status changes show up here.`
          : `Your recent work shows here when available. Ask an admin for the full Activity log.`) +
        `</p></div>`;
      return;
    }
    $("activity").innerHTML = rows.map((r) => (
      `<a class="row" href="${esc(r.href || (hasActivity ? "/ui/activity" : "#"))}">` +
      `<span class="row__main">` +
      `<b class="row__title">${esc(r.text)}</b>` +
      `<span class="row__sub">${esc(formatWhen(r.when))}</span></span></a>`
    )).join("");
  }

  function renderHomeCta() {
    const wrap = $("homectawrap");
    const cta = $("homecta");
    const u = payload.user || {};
    if (!wrap || !cta) return;
    if (!u.homeHref) {
      wrap.hidden = true;
      return;
    }
    wrap.hidden = false;
    cta.href = u.homeHref;
    cta.textContent = "Open " + (u.homeToolName || "home tool");
    // Quiet outline when needs compete for attention; solid when clear.
    const busy = !payload.needs_clear && (payload.needs || []).length > 0;
    cta.classList.toggle("btn-primary", !busy);
    cta.classList.toggle("hub-home-cta--quiet", busy); // marker for quiet/outline state
  }

  function setDockActive(mode) {
    document.querySelectorAll("[data-dock]").forEach((b) => {
      b.classList.toggle("is-active", b.getAttribute("data-dock") === mode);
    });
  }

  function renderRecent() {
    const recent = loadRecent();
    const u = payload.user || {};
    const homeName = u.homeToolName || "Your home tool";
    const home = u.homeHref
      ? { name: homeName, href: u.homeHref, granted: true }
      : null;
    const items = recent.length ? recent : (home ? [home] : []);
    if (!items.length) {
      $("recent").innerHTML =
        `<span class="muted" style="font-size:var(--text-sm)">No recent tools yet.</span>`;
      return;
    }
    $("recent").innerHTML = items.map((t) => {
      const ext = t.external ? ` target="_blank" rel="noopener noreferrer"` : "";
      return `<a class="chip" href="${esc(t.href)}"${ext}>${esc(t.name)}</a>`;
    }).join("");
  }

  function renderUserChrome() {
    const u = payload.user || {};
    ["railavatar", "topavatar"].forEach((id) => {
      const av = $(id);
      if (av) av.textContent = u.initials || "?";
    });
    const nm = $("railname");
    const rl = $("railrole");
    if (nm) nm.textContent = u.name || EMAIL;
    if (rl) rl.textContent = u.title || u.role || "";
    const nNeeds = (payload.needs || []).length;
    const badge = $("alertbadge");
    if (badge) {
      if (nNeeds > 0 && !payload.needs_clear) {
        badge.hidden = false;
        badge.textContent = String(nNeeds);
      } else {
        badge.hidden = true;
      }
    }
  }

  function showLive() {
    const sk = $("skel");
    const live = $("hublive");
    if (sk) sk.hidden = true;
    if (live) live.hidden = false;
  }

  function renderAll() {
    showLive();
    $("greeting").textContent = payload.greeting || "Hello.";
    const dl = $("dateline");
    if (dl) dl.textContent = formatDateLine(payload.generated_at) || "Today";
    // When clear, summary lives inside the clear banner — don't duplicate.
    $("summary").textContent = payload.needs_clear ? "" : (payload.summary || "");
    renderHomeCta();
    renderUserChrome();
    renderNav($("railnav"));
    renderQuickActions();
    renderNeeds();
    renderMetrics();
    renderQueue();
    renderPinned();
    renderActivity();
    renderRecent();
  }

  function paintInstantShell() {
    // Zero-Monday first paint from server-injected boot JSON.
    payload = HUB_BOOT && typeof HUB_BOOT === "object" ? HUB_BOOT : {
      greeting: "Hello.",
      user: { name: EMAIL, initials: "?", homeHref: "/ui/morning", homeToolName: "Morning Brief" },
      nav: { groups: [] },
      needs: [], needs_clear: false, metrics: [], quick_actions: [],
      activity: [], activity_deferred: true, pinned: [],
      queue: { title: "Queue", rows: [] },
    };
    if (payload.nav && Array.isArray(payload.nav.features)) {
      payload.nav.features.forEach((f) => FEATURES.add(f));
    }
    liveHydrated = false;
    renderAll();
  }

  function demoPayload() {
    const base = payload || {};
    const u = Object.assign({}, base.user || {}, {
      name: (base.user && base.user.name) || "Jordan Faulkner",
      initials: (base.user && base.user.initials) || "JF",
      title: (base.user && base.user.title) || "Owner",
      homeToolName: (base.user && base.user.homeToolName) || "Owner Pulse",
      homeHref: (base.user && base.user.homeHref) || "/ui/morning-owner",
    });
    return Object.assign({}, base, {
      user: u,
      greeting: "Good afternoon, Jordan.",
      generated_at: new Date().toISOString(),
      summary: "3 exceptions need you today.",
      needs_clear: false,
      needs: [
        {
          kind: "Safety", amount: "Stop-work", urgent: true,
          title: "21435 Abbys | Greg Gavin",
          detail: "Safety hold on Operations — clear before the crew mobilizes.",
          action: "Open Owner Pulse", href: "/ui/morning-owner",
          secondary_href: "/ui/jobcheck",
        },
        {
          kind: "Invoice", amount: "2 ready",
          title: "Jobs ready to invoice",
          detail: "Complete work waiting on an invoice draft — approve to send.",
          action: "Approve to send", href: "/ui/billing",
        },
        {
          kind: "Handoff", amount: "1",
          title: "Accepted bid needs Job Start",
          detail: "Won deal without a Projects item — hand off before billing.",
          action: "Open Job Start", href: "/ui/jobstart",
        },
      ],
      metrics: [
        { label: "Ready to invoice", value: 2, foot: "unbilled complete / ready", zero: false, unavailable: false },
        { label: "Team prep", value: "86%", foot: "ops ready for huddle", zero: false, unavailable: false },
        { label: "Safety / stop-work", value: 1, foot: "owner-visible holds", zero: false, unavailable: false },
        { label: "Planning flags", value: 0, foot: "route override signals", zero: true, unavailable: false },
      ],
      queue: {
        title: "Exceptions",
        link: "Open Owner Pulse",
        href: "/ui/morning-owner",
        rows: [
          { id: "demo-1", name: "21435 Abbys | Greg Gavin", sub: "Safety hold", tag: "Flag", flagged: true, href: "/ui/jobcheck?item=demo-1" },
          { id: "demo-2", name: "9761 Gertrude | Tedesco", sub: "Ready to invoice", tag: "Ready", href: "/ui/billing" },
          { id: "demo-3", name: "937 Madison Ridge | Kaiker", sub: "Needs handoff", tag: "Handoff", flagged: true, href: "/ui/jobstart?bid=demo-3" },
        ],
      },
      pinned: [
        { id: "demo-1", name: "21435 Abbys | Greg Gavin", sub: "Safety hold", href: "/ui/jobcheck?item=demo-1" },
      ],
      activity: [
        { text: "Job check · 21435 Abbys", when: new Date(Date.now() - 3600000).toISOString(), href: "/ui/activity" },
        { text: "Invoice · GVC-2026-C-012", when: new Date(Date.now() - 7200000).toISOString(), href: "/ui/activity" },
        { text: "Estimate Slack notice · 2026-0806-001", when: new Date(Date.now() - 86400000).toISOString(), href: "/ui/activity" },
      ],
      badges: { invoice: 2, morning_owner: 1, jobstart: 1 },
    });
  }

  function wireChrome() {
    $("menubtn").addEventListener("click", () => setDrawer(true));
    $("rail-close").addEventListener("click", () => setDrawer(false));
    $("rail").addEventListener("click", (e) => {
      if (e.target.closest(".nav-item") && !e.target.closest("[data-denied]")) {
        setDrawer(false);
      }
    });
    $("railsearch").addEventListener("input", (e) => renderNav($("railnav"), e.target.value));
    $("mobilesearch").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      const hits = flatTools().filter((t) =>
        t.granted && (!q || t.name.toLowerCase().includes(q))
      ).slice(0, 12);
      $("searchhits").innerHTML = hits.map((t) => {
        const ext = t.external ? ` target="_blank" rel="noopener noreferrer"` : "";
        return `<a class="row" href="${esc(t.href)}"${ext}>` +
          `<span class="row__main"><b class="row__title">${esc(t.name)}</b></span></a>`;
      }).join("") ||
        `<div class="empty empty-inline"><div class="empty__title">No tools match that search.</div></div>`;
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        $("searchpanel").hidden = true;
        setDrawer(false);
        setDockActive("home");
      }
    });

    document.querySelectorAll("[data-dock]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        const mode = btn.getAttribute("data-dock");
        if (mode === "tools") {
          setDockActive("tools");
          setDrawer(true);
          return;
        }
        if (mode === "search") {
          setDockActive("search");
          setDrawer(false);
          $("searchpanel").hidden = false;
          $("mobilesearch").focus();
          window.scrollTo({ top: 0, behavior: "smooth" });
          return;
        }
        if (mode === "alerts") {
          setDockActive("alerts");
          $("searchpanel").hidden = true;
          setDrawer(false);
          $("needs-kicker").scrollIntoView({ behavior: "smooth", block: "start" });
          return;
        }
        setDockActive("home");
        $("searchpanel").hidden = true;
        setDrawer(false);
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
  }

  function applyRefreshSlice(next) {
    if (!payload) payload = {};
    payload.badges = next.badges || {};
    payload.setup = next.setup || {};
    payload.needs = next.needs || payload.needs || [];
    payload.needs_clear = next.needs_clear;
    payload.summary = next.summary != null ? next.summary : (payload.summary || "");
    payload.metrics = next.metrics || payload.metrics || [];
    payload.queue = next.queue || payload.queue || { title: "Queue", rows: [] };
    if (next.generated_at) payload.generated_at = next.generated_at;
  }

  function renderLiveSlice() {
    // First paint / light poll — needs, metrics, queue, badges only.
    showLive();
    $("summary").textContent = payload.needs_clear ? "" : (payload.summary || "");
    const dl = $("dateline");
    if (dl && payload.generated_at) dl.textContent = formatDateLine(payload.generated_at);
    renderUserChrome();
    renderNeeds();
    renderMetrics();
    renderQueue();
    renderHomeCta();
  }

  async function fetchPayload() {
    // Boot chrome already painted. One Monday walk hydrates needs/metrics/queue.
    // Activity (Cloud Logging) loads after via /ui/api/hub/activity.
    const res = await fetch("/ui/api/hub", { credentials: "same-origin" });
    if (!res.ok) throw new Error("hub " + res.status);
    const next = await res.json();
    // Preserve boot quick_actions if live payload omits them.
    const quick = (payload && payload.quick_actions) || next.quick_actions || [];
    payload = next;
    if (quick.length && !(payload.quick_actions || []).length) {
      payload.quick_actions = quick;
    }
    liveHydrated = true;
    lastRefreshAt = Date.now();
    if (payload.nav && Array.isArray(payload.nav.features)) {
      payload.nav.features.forEach((f) => FEATURES.add(f));
    }
    if (payload.monday_trace && typeof console !== "undefined" && console.info) {
      console.info("[gvc monday_trace]", payload.monday_trace);
    }
    renderAll();
  }

  async function fetchActivityDeferred() {
    if (wantDemo) return;
    try {
      const res = await fetch("/ui/api/hub/activity", { credentials: "same-origin" });
      if (!res.ok || !payload) return;
      const next = await res.json();
      payload.activity = next.activity || [];
      payload.activity_deferred = false;
      renderActivity();
    } catch (_) {}
  }

  async function refreshBadges(force) {
    if (wantDemo) return;
    const now = Date.now();
    if (!force && lastRefreshAt && (now - lastRefreshAt) < REFRESH_MIN_MS) return;
    lastRefreshAt = now;
    try {
      // Light poll — badges/needs/queue only. Full /ui/api/hub re-hits Cloud
      // Logging activity on every tick; that made an idle hub feel heavy.
      const res = await fetch("/ui/api/hub/refresh", { credentials: "same-origin" });
      if (!res.ok) return;
      const next = await res.json();
      if (next.ok === false && !next.badges && !(next.needs || []).length) return;
      applyRefreshSlice(next);
      liveHydrated = true;
      renderUserChrome();
      renderNav($("railnav"), $("railsearch").value);
      renderNeeds();
      renderMetrics();
      renderQueue();
      renderPinned();
      renderHomeCta();
      $("summary").textContent = payload.needs_clear ? "" : (payload.summary || "");
    } catch (_) {}
  }

  function warmMondayAfterPaint() {
    // After first hub JSON — not concurrent with it. Warm force-refreshes
    // board walks and used to stampede Monday on cold boot next to /hub.
    fetch("/ui/api/monday/warm", {
      method: "POST", credentials: "same-origin", keepalive: true
    }).catch(() => {});
  }

  wireChrome();
  paintInstantShell();
  fetchPayload()
    .then(() => {
      if (wantDemo) {
        payload = demoPayload();
        liveHydrated = true;
        renderAll();
      }
      warmMondayAfterPaint();
      fetchActivityDeferred();
    })
    .catch((err) => {
      liveHydrated = true;
      showLive();
      // Keep boot rail/CTA; only flag that live slice failed.
      $("summary").textContent = "Couldn't refresh live numbers — " +
        String(err.message || err) + ". Tools still work from the rail.";
      renderNeeds();
      warmMondayAfterPaint();
    });

  setInterval(() => refreshBadges(false), BADGE_MS);
  window.addEventListener("focus", () => refreshBadges(false));
})();
</script>
</body>
</html>
